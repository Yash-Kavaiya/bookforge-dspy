[project]
name = "bookforge"
version = "1.0.0"
description = "DSPy pipeline that turns a YouTube channel into a compiled, verified LaTeX textbook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yash Kavaiya" }]
keywords = ["dspy", "llm", "latex", "youtube", "textbook", "gepa", "prompt-optimization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = [
    # Core: DSPy replaces google-adk entirely.
    "dspy>=3.3,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # Media pipeline
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "imagehash>=4.3",
    "Pillow>=10.0",
    # Deterministic asset rendering
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # multipart uploads
    "websockets>=12.0",         # live progress
]
gemini = [
    "google-genai>=1.0",  # optional Gemini File API video understanding
]
observability = ["mlflow>=3.6.0"]
lint = ["ruff>=0.8", "codespell>=2.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "codespell>=2.3",
    "httpx>=0.27",              # FastAPI TestClient
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
bookforge = "bookforge.cli:cli_entry"

[project.urls]
Homepage = "https://github.com/Yash-Kavaiya/bookforge-dspy"
Repository = "https://github.com/Yash-Kavaiya/bookforge-dspy"
Issues = "https://github.com/Yash-Kavaiya/bookforge-dspy/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bookforge*"]

[tool.setuptools.package-data]
# Angular's compiled output (frontend/ -> npm run build -> bookforge/api/webapp/).
bookforge = ["api/webapp/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a second",
    "network: tests that require network access (excluded by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:litellm.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function calls in argument defaults (pydantic Field)
    "RUF012",  # mutable class attrs without ClassVar (pydantic models)
    # Prompts, docs, and the number parser use typographic dashes and
    # operators on purpose (including a regex that must match an en dash).
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
# numpy must be resolved before the imports below, or dspy's lazy proxy
# crashes imagehash. The imports cannot move above that guard.
"bookforge/pipeline/__init__.py" = ["E402"]
# The unicode->TeX table maps ambiguous characters on purpose; that is its job.
"bookforge/tools/latex.py" = ["RUF001", "RUF003"]

[tool.codespell]
skip = "./data,data,./artifacts,.venv,*.pdf,uv.lock,*.json"
ignore-words-list = "nd,te,ot"

[tool.coverage.run]
source = ["bookforge"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
