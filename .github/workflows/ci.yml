name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is fully offline: no network, no API key, no model calls.
      - name: Test
        run: pytest --cov=bookforge --cov-report=term --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff codespell
      - run: ruff check bookforge tests
      - run: ruff format --check bookforge tests
        continue-on-error: true
      - run: codespell bookforge tests docs README.md

  smoke:
    name: End-to-end smoke (LaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Verification-by-execution is the core of the design, so CI installs a
      # real TeX distribution and compiles a chapter for it.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended

      - run: pip install -e ".[dev]"

      - name: Verify a chapter compiles for real
        run: |
          python - <<'PY'
          from bookforge.tools import latex as lx
          from bookforge.workspace import Workspace
          from pathlib import Path

          body = r"""
          \chapter{Smoke Test}\label{ch:smoke}
          \section*{Overview}
          A minimal chapter exercising the shared preamble, including a TikZ
          diagram with the styles chapters are told to use.
          \begin{figure}[htbp]\centering
          \begin{tikzpicture}[every node/.append style={align=center}]
          \node[modernbox] (a) {Input};
          \node[accentbox, below=1.2cm of a] (b) {Output};
          \draw[flowarrow] (a) -- (b);
          \end{tikzpicture}
          \caption{A flow.}\label{fig:smoke}
          \end{figure}
          Escaped specials: 50\% \& \#tag \_under \$dollar.
          """
          out = Path("build"); out.mkdir(exist_ok=True)
          main = Workspace.write_text(out / "smoke.tex", lx.chapter_wrapper(lx.PREAMBLE, body))
          result = lx.compile_tex(main, out, passes=1, cwd=Path("."))
          print("errors:", result.errors[:2000])
          assert result.ok, "the shared preamble does not compile"
          print("OK — overfull boxes:", result.overfull_boxes)
          PY
